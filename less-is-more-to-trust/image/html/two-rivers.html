<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --paper:#FAF7F0; --ink:#0E1116; --green:#1AB87C;
    --graphite:#3A4151; --mist:#9CB4CC; --brick:#6E6259;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:900px;height:1200px;background:var(--paper);
    font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);
    padding:52px 56px 40px;overflow:hidden;
  }
  .tag{
    display:inline-block;font-size:17px;font-weight:600;color:var(--green);
    border:1.5px solid var(--green);border-radius:999px;padding:5px 18px;margin-bottom:16px;letter-spacing:3px;
  }
  h1{font-size:44px;font-weight:700;letter-spacing:1px;}
  h1 .en{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:24px;color:var(--brick);margin-left:12px;}
  .section{margin-top:34px;}
  .river-label{font-size:18px;font-weight:600;color:var(--graphite);letter-spacing:3px;margin-bottom:18px;}
  .river-label b{color:var(--ink);font-size:20px;margin-right:10px;}
  .col{position:relative;}
  .col::before{
    content:"";position:absolute;left:47px;top:14px;bottom:14px;
    border-left:2.5px solid var(--mist);
  }
  .col.dashed::before{border-left:2.5px dashed var(--mist);}
  .row{display:flex;align-items:center;position:relative;padding:13px 0;}
  .avatar{
    width:96px;height:96px;border-radius:50%;flex:none;
    border:2.5px solid var(--ink);background-color:#fff;background-repeat:no-repeat;
    position:relative;z-index:1;
  }
  .row.hero .avatar{border:3.5px solid var(--green);}
  .txt{margin-left:26px;}
  .name{font-size:27px;font-weight:700;}
  .role{font-size:16px;color:var(--brick);margin-top:2px;letter-spacing:1px;}
  .note{font-size:19px;color:var(--graphite);margin-top:5px;line-height:1.45;}
  .note em{font-style:normal;color:var(--green);font-weight:700;}
  .gapnote{
    position:relative;z-index:1;margin:2px 0 2px 78px;
    font-size:16px;color:var(--brick);letter-spacing:2px;
    background:var(--paper);display:inline-block;padding:2px 8px;
  }
  .divider{border-top:1.5px solid rgba(156,180,204,.45);margin:26px 0 0;}
  .footer{margin-top:20px;font-size:14px;color:var(--brick);opacity:.8;}
</style>
</head>
<body>
  <div class="tag">溯 源</div>
  <h1>「少即是多」的两条河<span class="en">Less is more</span></h1>

  <div class="section">
    <div class="river-label"><b>西方</b>1855 年，从一句诗开始</div>
    <div class="col">
      <div class="row">
        <div class="avatar" style="background-image:url('../browning-oval.png');background-size:150%;background-position:50% 22%;"></div>
        <div class="txt">
          <div class="name">罗伯特·勃朗宁 <span class="role">诗人 · 1855</span></div>
          <div class="note">第一次写下 "Less is more"</div>
        </div>
      </div>
      <div class="row">
        <div class="avatar" style="background-image:url('../mies.jpg');background-size:135%;background-position:50% 20%;"></div>
        <div class="txt">
          <div class="name">密斯·凡德罗 <span class="role">建筑师 · 包豪斯</span></div>
          <div class="note">把它变成现代主义的信条</div>
        </div>
      </div>
      <div class="row hero">
        <div class="avatar" style="background-image:url('../dieter-rams.jpg');background-size:290%;background-position:30% 14%;"></div>
        <div class="txt">
          <div class="name">迪特·拉姆斯 <span class="role">博朗首席设计师</span></div>
          <div class="note">"Weniger, aber besser" —— <em>少，但更好</em></div>
        </div>
      </div>
      <div class="row">
        <div class="avatar" style="background-image:url('../jobs-headshot.jpg');background-size:cover;background-position:50% 25%;"></div>
        <div class="txt">
          <div class="name">乔布斯 / 艾维 <span class="role">苹果</span></div>
          <div class="note">把它做进上亿人的口袋</div>
        </div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="river-label"><b>东方</b>这条河更老</div>
    <div class="col dashed">
      <div class="row">
        <div class="avatar" style="background-image:url('../laozi-face.jpg');background-size:cover;background-position:50% 50%;"></div>
        <div class="txt">
          <div class="name">老子 <span class="role">先秦 · 《道德经》</span></div>
          <div class="note">少则得，多则惑；为道日损</div>
        </div>
      </div>
      <div class="gapnote">…… 约两千年后</div>
      <div class="row">
        <div class="avatar" style="background-image:url('../wang-yangming.jpg');background-size:145%;background-position:50% 16%;"></div>
        <div class="txt">
          <div class="name">王阳明 <span class="role">明代 · 《传习录》</span></div>
          <div class="note">惟精惟一 · 舂米之喻</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">人像来源：Wikimedia Commons（公有领域 / CC 授权）</div>
</body>
</html>

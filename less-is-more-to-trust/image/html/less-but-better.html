<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --paper:#FAF7F0; --ink:#0E1116; --green:#1AB87C;
    --graphite:#3A4151; --mist:#9CB4CC; --brick:#6E6259;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:900px;height:1200px;background:var(--paper);
    font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);
    padding:72px 64px;overflow:hidden;position:relative;
  }
  .small{font-size:22px;color:var(--brick);letter-spacing:2px;}
  .quote1{
    font-family:Georgia,serif;font-size:56px;color:var(--mist);
    margin:12px 0 44px;font-weight:400;
  }
  .quote2{
    font-family:Georgia,serif;font-size:68px;font-weight:700;color:var(--ink);
    line-height:1.2;margin:14px 0 22px;
  }
  .quote2 em{font-style:normal;color:var(--green);}
  .cn{font-family:"Songti SC",serif;font-size:44px;color:var(--graphite);margin-top:8px;}
  .cn em{font-style:normal;color:var(--green);font-weight:900;}
  .viz{position:relative;margin-top:84px;height:330px;}
  .chaff{position:absolute;left:30px;top:60px;width:190px;height:190px;}
  .chaff i{position:absolute;border-radius:50%;background:var(--brick);opacity:.55;}
  .varrow{position:absolute;left:270px;top:130px;color:var(--mist);font-size:44px;}
  .bowl{
    position:absolute;right:60px;top:120px;width:290px;height:145px;
    border:3.5px solid var(--ink);border-top:none;border-radius:0 0 160px 160px;background:#fff;
    overflow:hidden;
  }
  .bowl i{position:absolute;width:16px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--graphite);}
  .heap{position:absolute;right:100px;top:64px;width:210px;height:56px;}
  .heap i{position:absolute;width:17px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--graphite);}
  .vlabel{position:absolute;font-size:22px;color:var(--brick);letter-spacing:6px;}
  .footer{
    position:absolute;left:0;right:0;bottom:80px;text-align:center;
    font-family:"Songti SC",serif;font-size:28px;color:var(--graphite);letter-spacing:4px;
  }
</style>
</head>
<body>
  <div class="small">大家天天引用的是</div>
  <div class="quote1">"Less is more."</div>
  <div class="small">而拉姆斯的原话是</div>
  <div class="quote2">"Less, but <em>better</em>."</div>
  <div class="cn">少，但<em>更好</em>。</div>

  <div class="viz">
    <i class="vlabel" style="left:96px;top:6px;">糠</i>
    <div class="chaff">
      <i style="left:10px;top:28px;width:13px;height:9px;"></i>
      <i style="left:56px;top:8px;width:11px;height:8px;"></i>
      <i style="left:102px;top:38px;width:14px;height:9px;"></i>
      <i style="left:30px;top:79px;width:11px;height:8px;"></i>
      <i style="left:82px;top:97px;width:13px;height:9px;"></i>
      <i style="left:133px;top:77px;width:10px;height:8px;"></i>
      <i style="left:15px;top:133px;width:13px;height:8px;"></i>
      <i style="left:66px;top:151px;width:11px;height:9px;"></i>
      <i style="left:123px;top:128px;width:13px;height:8px;"></i>
      <i style="left:164px;top:20px;width:10px;height:8px;"></i>
      <i style="left:158px;top:160px;width:11px;height:8px;"></i>
    </div>
    <div class="varrow">➝</div>
    <i class="vlabel" style="right:200px;top:6px;">米</i>
    <div class="heap">
      <i style="left:80px;top:0;"></i>
      <i style="left:55px;top:20px;"></i>
      <i style="left:105px;top:20px;"></i>
      <i style="left:30px;top:40px;"></i>
      <i style="left:80px;top:40px;"></i>
      <i style="left:130px;top:40px;"></i>
      <i style="left:155px;top:40px;"></i>
      <i style="left:5px;top:40px;"></i>
    </div>
    <div class="bowl">
      <i style="left:26px;top:10px;"></i><i style="left:66px;top:5px;"></i><i style="left:108px;top:12px;"></i>
      <i style="left:150px;top:5px;"></i><i style="left:192px;top:12px;"></i><i style="left:232px;top:7px;"></i>
      <i style="left:45px;top:30px;"></i><i style="left:88px;top:33px;"></i><i style="left:130px;top:28px;"></i>
      <i style="left:172px;top:33px;"></i><i style="left:212px;top:30px;"></i>
    </div>
  </div>

  <div class="footer">舂掉的是糠，留下的是米。</div>
</body>
</html>

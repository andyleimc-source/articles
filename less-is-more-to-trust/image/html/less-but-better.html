<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --paper:#FAF7F0; --ink:#0E1116; --green:#1AB87C;
    --graphite:#3A4151; --mist:#9CB4CC; --brick:#6E6259;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:1280px;height:640px;background:var(--paper);
    font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);
    padding:72px 80px;overflow:hidden;position:relative;
  }
  .small{font-size:18px;color:var(--brick);letter-spacing:2px;}
  .quote1{
    font-family:Georgia,serif;font-size:54px;color:var(--mist);
    margin:10px 0 40px;font-weight:400;text-decoration:none;
  }
  .quote2{
    font-family:Georgia,serif;font-size:76px;font-weight:700;color:var(--ink);
    line-height:1.15;margin:12px 0 20px;
  }
  .quote2 em{font-style:normal;color:var(--green);}
  .cn{font-family:"Songti SC",serif;font-size:36px;color:var(--graphite);margin-top:6px;}
  .cn em{font-style:normal;color:var(--green);font-weight:900;}
  .footer{
    position:absolute;left:80px;bottom:56px;
    font-family:"Songti SC",serif;font-size:20px;color:var(--brick);letter-spacing:3px;
  }
  /* 右侧：糠 → 米 */
  .viz{position:absolute;right:80px;top:96px;width:360px;height:420px;}
  .chaff{position:absolute;left:0;top:0;width:150px;height:150px;}
  .chaff i{position:absolute;border-radius:50%;background:var(--brick);opacity:.55;}
  .bowl{
    position:absolute;right:6px;bottom:60px;width:230px;height:115px;
    border:3px solid var(--ink);border-top:none;border-radius:0 0 130px 130px;background:#fff;
    overflow:hidden;
  }
  .bowl i{position:absolute;width:13px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--graphite);}
  .heap{position:absolute;right:36px;bottom:172px;width:170px;height:46px;}
  .heap i{position:absolute;width:14px;height:10px;border-radius:50%;background:#fff;border:1.5px solid var(--graphite);}
  .vlabel{position:absolute;font-size:16px;color:var(--brick);letter-spacing:4px;}
  .varrow{position:absolute;left:120px;top:150px;width:80px;color:var(--mist);font-size:30px;transform:rotate(38deg);}
</style>
</head>
<body>
  <div class="small">大家天天引用的是</div>
  <div class="quote1">"Less is more."</div>
  <div class="small">而拉姆斯的原话是</div>
  <div class="quote2">"Less, but <em>better</em>."</div>
  <div class="cn">少，但<em>更好</em>。</div>
  <div class="footer">舂掉的是糠，留下的是米。</div>

  <div class="viz">
    <i class="vlabel" style="left:26px;top:-28px;">糠</i>
    <div class="chaff">
      <i style="left:8px;top:22px;width:10px;height:7px;"></i>
      <i style="left:44px;top:6px;width:9px;height:6px;"></i>
      <i style="left:80px;top:30px;width:11px;height:7px;"></i>
      <i style="left:24px;top:62px;width:9px;height:6px;"></i>
      <i style="left:64px;top:76px;width:10px;height:7px;"></i>
      <i style="left:104px;top:60px;width:8px;height:6px;"></i>
      <i style="left:12px;top:104px;width:10px;height:6px;"></i>
      <i style="left:52px;top:118px;width:9px;height:7px;"></i>
      <i style="left:96px;top:100px;width:10px;height:6px;"></i>
      <i style="left:128px;top:16px;width:8px;height:6px;"></i>
    </div>
    <div class="varrow">➝</div>
    <i class="vlabel" style="right:100px;top:170px;">米</i>
    <div class="heap">
      <i style="left:64px;top:0;"></i>
      <i style="left:44px;top:16px;"></i>
      <i style="left:84px;top:16px;"></i>
      <i style="left:24px;top:32px;"></i>
      <i style="left:64px;top:32px;"></i>
      <i style="left:104px;top:32px;"></i>
      <i style="left:124px;top:32px;"></i>
      <i style="left:4px;top:32px;"></i>
    </div>
    <div class="bowl">
      <i style="left:20px;top:8px;"></i><i style="left:52px;top:4px;"></i><i style="left:86px;top:10px;"></i>
      <i style="left:120px;top:4px;"></i><i style="left:154px;top:10px;"></i><i style="left:186px;top:6px;"></i>
      <i style="left:36px;top:24px;"></i><i style="left:70px;top:26px;"></i><i style="left:104px;top:22px;"></i>
      <i style="left:138px;top:26px;"></i><i style="left:170px;top:24px;"></i>
    </div>
  </div>
</body>
</html>

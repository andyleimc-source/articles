<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --paper:#FAF7F0; --ink:#0E1116; --green:#1AB87C;
    --graphite:#3A4151; --mist:#9CB4CC; --brick:#6E6259;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:900px;height:1200px;background:var(--paper);
    font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:var(--ink);
    padding:56px 60px;overflow:hidden;
  }
  .tag{
    display:inline-block;font-size:17px;font-weight:600;color:var(--green);
    border:1.5px solid var(--green);border-radius:999px;padding:5px 18px;margin-bottom:16px;letter-spacing:3px;
  }
  h1{font-size:46px;font-weight:700;letter-spacing:1px;}
  .sub{font-size:21px;color:var(--brick);margin-top:12px;letter-spacing:1px;}
  .stations{margin-top:40px;}
  .card{
    border:1.5px solid var(--mist);border-radius:18px;background:#fff;
    padding:30px 34px;position:relative;
  }
  .card.now{border:3px solid var(--green);box-shadow:7px 7px 0 rgba(26,184,124,.14);}
  .era{font-size:17px;color:var(--brick);letter-spacing:2px;}
  .what{font-size:38px;font-weight:800;margin-top:8px;}
  .card.now .what{color:var(--green);}
  .desc{font-size:20px;color:var(--graphite);margin-top:12px;line-height:1.6;}
  .desc .q{font-family:"Songti SC",serif;}
  .badge{
    position:absolute;top:-18px;right:26px;background:var(--green);color:#fff;
    font-size:17px;font-weight:700;border-radius:999px;padding:5px 20px;letter-spacing:4px;
  }
  .arr{text-align:center;color:var(--mist);font-size:40px;font-weight:700;line-height:1.2;margin:6px 0;}
  .footer{margin-top:34px;font-size:20px;color:var(--graphite);letter-spacing:1px;line-height:1.6;}
  .footer b{color:var(--ink);}
</style>
</head>
<body>
  <div class="tag">三次迁移</div>
  <h1>稀缺的东西，在往下游搬家</h1>
  <div class="sub">稀不稀缺，取决于抢它的东西有多少</div>

  <div class="stations">
    <div class="card">
      <div class="era">印刷 / 电视时代</div>
      <div class="what">信息稀缺</div>
      <div class="desc">信息本身就是权力，谁先拿到信息，谁赢。</div>
    </div>
    <div class="arr">↓</div>
    <div class="card">
      <div class="era">互联网 / 智能手机时代</div>
      <div class="what">注意力稀缺</div>
      <div class="desc"><span class="q">「信息的丰盛，制造注意力的贫困。」</span><br>—— 赫伯特·西蒙，1971</div>
    </div>
    <div class="arr">↓</div>
    <div class="card now">
      <div class="badge">现 在</div>
      <div class="era">AI 时代</div>
      <div class="what">信任 · 判断稀缺</div>
      <div class="desc">内容可以无限生成之后，贵的是「哪个能信、哪个值得花时间」。</div>
    </div>
  </div>

  <div class="footer">每一次搬家，都造就一批新产品：<br>上一次是 <b>iPhone</b>，这一次的名字还没出现。</div>
</body>
</html>
